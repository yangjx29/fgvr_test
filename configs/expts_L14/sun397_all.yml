# SUN397 实验配置 (ViT-L/14)
setup: ours
experiment: 5.0

# Dataset
dataset_name: sun397
num_classes: 397
num_base: 198
num_novel: 199

# Training
seed: 1
batch_size: 128  # 针对L14模型调整，397个类别较大

# Text-clustering Method
clustering_method: multi_clip_voting

# Model
model_size: ViT-L/14
model_size_vqa: FlanT5-XXL # 针对L14模型调整
model_size_mllm: Qwen2.5-VL-7B
model_type_llm: gpt-3.5-turbo

image_size: 224
verbose: False
