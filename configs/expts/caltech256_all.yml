# Caltech-256 实验配置
setup: ours
experiment: 5.0

# Dataset
dataset_name: caltech256
num_classes: 257
num_base: 128
num_novel: 129

# Training
seed: 1
batch_size: 96  # 类别数较多，适当减小batch size

# Text-clustering Method
clustering_method: multi_clip_voting

# Model
model_size: ViT-B/16
model_size_vqa: OPT6.7B-COCO
model_size_mllm: Qwen2.5-VL-7B
model_type_llm: gpt-3.5-turbo

image_size: 224
verbose: False

