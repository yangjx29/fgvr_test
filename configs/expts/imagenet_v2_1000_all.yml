# ImageNetV2 数据集配置文件
# 包含1000个类别的ImageNetV2数据集
# 训练集: imagenetv2-matched-frequency-format-val
# 测试集: imagenetv2-top-images-format-val

# 基本配置
setup: ours
experiment: 5.0

# 数据集配置
dataset_name: "imagenet_v2"  # 数据集名称
num_classes: 1000            # 类别数量
num_base: 500                # 基础类别数
num_novel: 500               # 新类别数

# 超类信息
superclass: "object"

# 训练配置
seed: 1
batch_size: 32

# 聚类方法
clustering_method: multi_clip_voting

# 模型配置
model_size: ViT-B/16
model_size_vqa: OPT6.7B-COCO
model_size_mllm: Qwen2.5-VL-7B
model_type_llm: gpt-3.5-turbo

image_size: 224
verbose: False
