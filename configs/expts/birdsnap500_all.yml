# BirdSnap数据集配置文件
# 包含500个鸟类类别
setup: ours
experiment: 5.0

# Dataset
dataset_name: birdsnap
num_classes: 500
num_base: 250
num_novel: 250

# Training
seed: 1
batch_size: 32  # 根据GPU显存调整，500个类别较大，适当减小batch_size

# Text-clustering Method
clustering_method: multi_clip_voting

# Model
model_size: ViT-B/16
model_size_vqa: OPT6.7B-COCO
model_size_mllm: Qwen2.5-VL-7B
model_type_llm: gpt-3.5-turbo

image_size: 224
verbose: False
