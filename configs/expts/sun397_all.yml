# SUN397 实验配置
setup: ours
experiment: 5.0

# Dataset
dataset_name: sun397
num_classes: 397
num_base: 198
num_novel: 199

# Training
seed: 1
batch_size: 64  # 根据GPU显存调整，397个类别较大，适当减小batch_size

# Text-clustering Method
clustering_method: multi_clip_voting

# Model
model_size: ViT-B/16
model_size_vqa: OPT6.7B-COCO
model_size_mllm: Qwen2.5-VL-7B
model_type_llm: gpt-3.5-turbo

image_size: 224
verbose: False
